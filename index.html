<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 시설 고장 신고함</title>
    <style>
        body { font-family: '맑은 고딕', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; transition: all 0.3s ease; } /* 변경 시 부드러운 효과 */
        label { font-weight: bold; margin-top: 10px; display: block; color: #555; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="form-container">
    <h2 id="form-title">🛠️ 학교 시설 고장 신고</h2>
    
    <form action="https://formspree.io/f/meerzweb" method="POST">
        
        <label for="location">장소</label>
        <input type="text" id="location" name="location" placeholder="예: 본관 2층 화장실" required>

        <label for="type">건의 종류</label>
        <select id="type" name="type" onchange="updateTitle()">
            <option value="고장시설">🛠️ 고장시설 신고</option>
            <option value="학교생활 안전 아이디어">💡 안전 아이디어 제안</option>
            <option value="안전문제">⚠️ 안전문제 신고</option>
            <option value="기타">🤔 기타 문의/건의</option>
        </select>

        <label for="details">상세 내용</label>
        <textarea id="details" name="details" rows="4" placeholder="내용을 상세히 적어주세요" required></textarea>

        <button type="submit">제출하기</button>
    </form>
</div>

<script>
    function updateTitle() {
        const selectElement = document.getElementById('type');
        const titleElement = document.getElementById('form-title');
        
        // 선택된 옵션의 텍스트를 가져와서 제목에 반영
        const selectedText = selectElement.options[selectElement.selectedIndex].text;
        titleElement.innerText = selectedText;
    }
</script>

</body>
</html>
